<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>MHD Scanner</h1>
<div id="app-version"></div>

<div id="camera-container">
    <video id="camera" autoplay playsinline></video>
    <div id="roi">將日期放入框內</div>
</div>

<div>
    <button id="startBtn">開啟相機</button>
    <button id="captureBtn" style="display:none;">掃描</button>
</div>

<div id="data-panel">
    <h2>資料</h2>
    <div id="input-grid">
        <div class="input-box">
            <label>Barcode</label>
            <input id="barcodeInput" readonly>
        </div>

        <div class="input-box">
            <label>Artikel</label>
            <input id="artikelInput" type="text">
        </div>
        <div class="input-box">
            <label>MHD</label>
            <input id="mhdInput" type="text">
        </div>
        <div class="input-box">
            <label>數量</label>
            <input id="qtyInput" type="number">
        </div>
    </div>
    <div id="data-buttons">
        <button id="submitBtn">送出資料</button>
        <button id="clearBtn">清除資料</button>
    </div>
</div>

<p id="status">等待開始</p>

<canvas id="snapshot"></canvas>
<div id="toast"></div>
<div id="debug">
    Debug:
</div>

<script src="./js/config.js"></script>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/@paddlejs/paddlejs"></script> -->
<script>
    document.getElementById("app-version").innerHTML=
    APP_CONFIG.name+" "+APP_CONFIG.version;
</script>
<script type="module" src="./js/main.js"></script>

</body>

</html>
